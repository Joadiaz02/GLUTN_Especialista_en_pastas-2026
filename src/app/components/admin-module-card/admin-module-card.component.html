<ion-card class="module-card" button (click)="seleccionar()">
  <ion-card-content>
    <div class="top">
      <div class="module-icon">
        <!-- <ion-icon [name]="module.icon" ></ion-icon> -->
        <ion-icon [src]="'assets/icons/' + icon + '.svg'"></ion-icon>
      </div>

      <ion-icon
        class="arrow-icon"
        src="assets/icons/arrow-right-2.svg"
      ></ion-icon>
    </div>

    <div class="module-info">
      <h2>{{ module.title }}</h2>

      <p>{{ module.description }}</p>
    </div>
  </ion-card-content>
</ion-card>
