<ion-card class="module-card" button (click)="seleccionar()">
  <ion-card-content [class.card-content--large]="agrandar">
    <div class="top">
      <div class="module-icon" [class.module-icon-wrapper--large]="agrandar">
        <!-- <ion-icon [name]="module.icon" ></ion-icon> -->
        <ion-icon
          [src]="'assets/icons/' + icon + '.svg'"
          [class.module-icon--large]="agrandar"
        ></ion-icon>
      </div>

      <ion-icon
        [class.module-icon--large]="agrandar"
        class="arrow-icon"
        src="assets/icons/arrow-right-2.svg"
      ></ion-icon>
    </div>

    <div class="module-info">
      <h2 [class.title--large]="agrandar">{{ module.title }}</h2>

      <p [class.description--large]="agrandar">{{ module.description }}</p>
    </div>
  </ion-card-content>
</ion-card>
