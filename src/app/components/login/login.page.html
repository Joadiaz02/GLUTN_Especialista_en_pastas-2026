<link rel="stylesheet" href="./login.page.scss">

<div class="login">
  <div >
    <h1 class="textos">iniciar sesion</h1>
    <p class="textos">por favor inicie secion primero para drisfutar del servicio</p>
  </div>
  <label class="textos" [style.color]="cargando ? 'red' : 'black'">correo electronico</label>
  <input [(ngModel)]="email" class="input" ,type="email" , placeholder="jperez@ejemplo.com" >
  <label class="textos " [style.color]="cargando ? 'red' : 'black' " >contraseña</label>
  <input [(ngModel)]="contrasena" class="input" , type="password" ,placeholder="Contraseña">
  @if (cargando == true) {
    <p class="textos" style="color: red; font-size: 0.85em;">email o contraseña incorrecto</p>
  }

   @if (error_login) {
    <p class="error">{{ error_login }}</p>
  }
    

  <button (click)="iniciarSesion()" [disabled]="cargando" class="boton_i">
    @if (cargando) {
      Cargando...
    } @else {
      Iniciar sesión
    }
  </button>

  <div >
  <span class="linea"></span>
  <span class="punto"></span>
  <span class="linea"></span>
  </div>
  <div>
  <button routerLink="/invitado" [disabled]="cargando" class="boton_c" >
    @if (cargando) {
      Cargando...
    } @else {
      Continuar como invitado
    }
  </button>
  </div>
  <button routerLink="/acceso_rapido" [disabled]="cargando" class="boton_a">
    @if (cargando) {
      Cargando...
    } @else {
      Acceso rapido
    }

  <div class="registrate">
  <p >¿no tenes cuenta?<a routerLink="/registro" >Registrate</a></p>
</div>
