

<div class="estado-pedido">
  <h2 class="heading-medium weight-bold">Estado de tu pedido:</h2>
  <p class="body-medium">{{ estadoLegible() }}</p>

  @if (estado() === 'rechazado') {
    <ion-button shape="round" expand="block" (click)="modificar()">
      Modificar pedido
    </ion-button>
  }

  @if (estado() === 'entregado') {
    <ion-button shape="round" expand="block" [disabled]="confirmando()" (click)="confirmarRecepcion()">
      Confirmar recepción
    </ion-button>
  }

  @if (estado() === 'recibido') {
    <ion-button shape="round" expand="block" (click)="solicitarCuenta()">
      Solicitar cuenta
    </ion-button>
  }

  <ion-button shape="round" expand="block" (click)="volver()">
    Volver
  </ion-button>
</div>
