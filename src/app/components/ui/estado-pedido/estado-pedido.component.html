<div class="estado-pedido">

  <h2 class="estado-pedido__titulo">
    Estado de tu pedido
  </h2>

<div class="estado-pedido__indicador">
<div class="estado-pedido__valor">
    <span class="estado-pedido__punto"></span>
    <span>{{ estadoLegible() }}</span>
  </div>
</div>

  @if (estado() === 'rechazado') {
    <ion-button
      shape="round"
      expand="block"
      (click)="modificar()"
    >
      Modificar pedido
    </ion-button>
  }

  @if (estado() === 'entregado') {
    <ion-button
      shape="round"
      expand="block"
      [disabled]="confirmando()"
      (click)="confirmarRecepcion()"
    >
      Confirmar recepción
    </ion-button>
  }

  @if (estado() === 'recibido') {
    <ion-button
      shape="round"
      expand="block"
      (click)="solicitarCuenta()"
    >
      Solicitar cuenta
    </ion-button>
  }

  @if (estado() === 'cuenta_entregada') {
    <ion-button
      shape="round"
      expand="block"
      (click)="verCuenta()"
    >
      Ver mi cuenta
    </ion-button>
  }

  <ion-button
    class="estado-pedido__cerrar"
    shape="round"
    expand="block"
    (click)="volver()"
  >
    Cerrar
  </ion-button>

</div>
