@if (carrito.totalItems() > 0) {

  <div class="barra-pedido">

    <!-- ==================================
         CARRITO
    =================================== -->

    <div class="barra-carrito-icono">

      <img
        src="assets/icons/cart.svg"
        alt=""
      />

      <span class="contador">
        {{ carrito.totalItems() }}
      </span>

    </div>


    <!-- ==================================
         INFORMACIÓN
    =================================== -->

    <div class="barra-pedido__info">

      <span class="barra-cantidad">

        {{
          carrito.totalItems() === 1
            ? '1 producto'
            : carrito.totalItems() + ' productos'
        }}

      </span>


      <span class="barra-total">

        Total:

        <strong>

          {{
            carrito.importeTotal()
              | currency:
                'ARS':
                '$':
                '1.0-0'
          }}

        </strong>

      </span>

    </div>


    <!-- ==================================
         TIEMPO
    =================================== -->

    <div class="barra-tiempo">

      <img
        class="barra-tiempo__icon"
        src="assets/icons/clock.svg"
        alt=""
      />

      <span>
        {{ tiempoTexto() }}
      </span>

    </div>


    <!-- ==================================
         BOTÓN
    ================================== -->

    <ion-button
      shape="round"
      class="barra-boton"
      (click)="abrirPedido()"
    >

      {{ textoBoton }}

      <img
        class="barra-boton__flecha"
        src="assets/icons/chevron-right.svg"
        alt=""
      />

    </ion-button>

  </div>

}
