@if (carrito.totalItems() > 0) {

  <div class="barra-pedido">


    <!-- CARRITO -->

    <div class="barra-carrito-icono">

      <span class="contador">
        {{ carrito.totalItems() }}
      </span>

      🛒

    </div>


    <!-- INFORMACIÓN -->

    <div class="barra-pedido__info">

      <span class="barra-cantidad">

        {{
          carrito.totalItems() === 1
            ? '1 producto'
            : carrito.totalItems() + ' productos'
        }}

      </span>


      <span class="barra-total">

        Total:

        <strong>
          {{
            carrito.importeTotal()
              | currency:'ARS':'$':'1.0-0'
          }}
        </strong>

      </span>

    </div>


    <!-- TIEMPO -->

    <div class="barra-tiempo">

      <span class="barra-tiempo__icon">
        🕐
      </span>

      <span>
        {{ tiempoTexto() }}
      </span>

    </div>


    <!-- BOTÓN -->

    <ion-button
      shape="round"
      class="barra-boton"
      (click)="abrirPedido()"
    >

      {{ textoBoton }}

      <span class="flecha">
        ›
      </span>

    </ion-button>

  </div>

}
