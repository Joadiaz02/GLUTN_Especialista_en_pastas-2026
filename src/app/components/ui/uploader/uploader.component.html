@if (photoPreview()) {
<div class="uploader uploader--has-preview">
  <img [src]="photoPreview()" alt="Preview" class="uploader__preview" />
  <button
    type="button"
    (click)="open()"
    class="uploader__edit-badge"
    aria-label="Cambiar foto"
  >
    <svg
      width="20"
      height="20"
      viewBox="0 0 20 20"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <g clip-path="url(#clip0_3354_2007)">
        <mask
          id="a"
          style="mask-type: luminance"
          maskUnits="userSpaceOnUse"
          x="0"
          y="0"
          width="20"
          height="20"
        >
          <path d="M20 0H0v20h20z" fill="#fff" />
        </mask>
        <g
          mask="url(#a)"
          stroke="#fff"
          stroke-width="1.25"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M9.166 1.667H7.499c-4.166 0-5.833 1.666-5.833 5.833v5c0 4.166 1.667 5.833 5.833 5.833h5c4.167 0 5.834-1.666 5.834-5.833v-1.667"
          />
          <path
            d="M13.366 2.516 6.799 9.083c-.25.25-.5.741-.55 1.1L5.89 12.69c-.134.908.508 1.542 1.416 1.417l2.509-.359c.35-.05.841-.3 1.1-.55l6.566-6.566c1.134-1.134 1.667-2.45 0-4.117-1.666-1.667-2.983-1.133-4.116 0"
            stroke-miterlimit="10"
          />
          <path
            d="M12.424 3.459a5.95 5.95 0 0 0 4.117 4.116"
            stroke-miterlimit="10"
          />
        </g>
      </g>
    </svg>
  </button>
</div>
} @else {
<button type="button" (click)="open()" class="uploader" aria-label="Subir foto">
  <ion-icon src="assets/icons/plus.svg"></ion-icon>
</button>
}
