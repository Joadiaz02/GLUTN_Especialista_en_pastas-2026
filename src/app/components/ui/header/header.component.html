<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      @if (mostrarVolver()) {
        <app-confirm-volver
          [titulo]="tituloVolver()"
          [mensaje]="mensajeVolver()"
          [textoConfirmar]="textoConfirmarVolver()"
          [colorConfirmar]="colorConfirmarVolver()"
          (confirmadoVolver)="volver.emit()"
        ></app-confirm-volver>
      }
    </ion-buttons>

    <ion-buttons slot="end">
      @if (mostrarCerrarSesion()) {
        <app-confirm-dialog
          titulo="¿Cerrar sesión?"
          mensaje="Vas a tener que volver a ingresar tus credenciales para acceder de nuevo."
          textoConfirmar="Cerrar sesión"
          icono="log-out-outline"
          (confirmado)="cerrarSesion.emit()"
        ></app-confirm-dialog>
      }
      <ng-content select="[headerFin]"></ng-content>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
