<ion-header
  class="ion-no-border glutn-header"
>

  <ion-toolbar>

    <ion-buttons slot="start">

      @if (mostrarVolver()) {

        <app-confirm-volver
          [titulo]="tituloVolver()"
          [mensaje]="mensajeVolver()"
          [textoConfirmar]="
            textoConfirmarVolver()
          "
          [colorConfirmar]="
            colorConfirmarVolver()
          "
          (confirmadoVolver)="
            volver.emit()
          "
        />

      }

    </ion-buttons>


    <ion-buttons slot="end">

      @if (mostrarCerrarSesion()) {

        <app-confirm-dialog
          titulo="¿Cerrar sesión?"
          mensaje="Vas a tener que volver a ingresar tus credenciales para acceder de nuevo."
          textoConfirmar="Cerrar sesión"
          icono="log-out-outline"
          (confirmado)="
            cerrarSesion.emit()
          "
        />

      }


      <ng-content
        select="[headerFin]"
      />

    </ion-buttons>

  </ion-toolbar>

</ion-header>
