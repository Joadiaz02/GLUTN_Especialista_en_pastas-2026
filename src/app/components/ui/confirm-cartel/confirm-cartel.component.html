@if (!esContenidoModal) {
<ion-button
  class="boton-salir"
  fill="solid"
  shape="round"
  color="danger"
  aria-label="Cerrar sesión"
  (click)="abrirConfirmacion()"
>
  <ion-icon
    slot="icon-only"
    src="assets/icons/logout.svg"
  ></ion-icon>
</ion-button>
} @else {
<div class="confirm-dialog">
  <div class="confirm-dialog__content">
    <div class="confirm-dialog__icon-circle">
      <!-- <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.265 9.324a.254.254 0 0 1 .352 0l2.56 2.56a.256.256 0 0 1 0 .353l-2.56 2.56a.24.24 0 0 1-.177.073.24.24 0 0 1-.175-.073.254.254 0 0 1 0-.353l2.029-2.03.354-.354-.354-.353-2.03-2.03a.254.254 0 0 1 0-.353Z" fill="#fff" stroke="#fff"/>
          <path d="M19.93 12.81H9.76c-.41 0-.75-.34-.75-.75s.34-.75.75-.75h10.17c.41 0 .75.34.75.75s-.34.75-.75.75" fill="#fff"/>
          <path d="M11.76 20.75c-5.15 0-8.75-3.6-8.75-8.75s3.6-8.75 8.75-8.75c.41 0 .75.34.75.75s-.34.75-.75.75c-4.27 0-7.25 2.98-7.25 7.25s2.98 7.25 7.25 7.25c.41 0 .75.34.75.75s-.34.75-.75.75" fill="#fff"/>
        </svg> -->
      <ion-icon [name]="icono"></ion-icon>
    </div>

    <h2 class="confirm-dialog__title heading-medium weight-bold">
      {{ titulo }}
    </h2>

    <p class="confirm-dialog__description body-medium weight-regular mensaje">
      {{ mensaje }}
    </p>
  </div>

  <div class="confirm-dialog__actions">
    <ion-button shape="round" fill="outline" (click)="cancelar()">
      {{ textoCancelar }}
    </ion-button>

    <ion-button shape="round" [color]="colorConfirmar" (click)="confirmar()">
      {{ textoConfirmar }}
    </ion-button>
  </div>
</div>
}
