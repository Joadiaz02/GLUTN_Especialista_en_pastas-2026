<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <app-confirm-volver (confirmadoVolver)="volver()"></app-confirm-volver>
    </ion-buttons>

    <ion-title>Pedidos</ion-title>

    <ion-buttons slot="end">
      <app-confirm-dialog
        titulo="¿Cerrar sesión?"
        mensaje="Vas a tener que volver a ingresar tus credenciales para acceder de nuevo."
        textoConfirmar="Cerrar sesión"
        (confirmado)="cerrarSesion()"
      ></app-confirm-dialog>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @for (pedido of pedidosFiltrados(); track pedido.id_pedido) {
    <div class="pedido-card">
      <div class="pedido-header-info">
        <span class="pedido-mesa">Mesa {{ pedido.id_mesa.slice(0, 8) }}</span>
        <span class="pedido-mesa">{{ pedido.fecha_emision_pedido | date:'dd/mm/yy hh:mm' }}</span>
      </div>

      <div class="pedido-items-lista">
        @for (item of pedido.pedido_item; track item.id_item) {
          <div class="pedido-item-row">
            <span class="body-small"><strong>{{ item.cantidad }}x</strong> {{ item.carta.nombre }}</span>
          </div>
        }
      </div>

      
    </div>
  }
</ion-content>
