<ion-content
  [fullscreen]="true"
  class="quick-content"
>
  <main class="quick-page">
    <header class="quick-header">
      <button
        class="back-button"
        type="button"
        (click)="volver()"
        aria-label="Volver al inicio de sesión"
      >
        <ion-icon
          name="arrow-back-outline"
        ></ion-icon>
      </button>
    </header>

    <div class="logo-container">
      <img
        src="assets/images/LOGO-GLUTN.png"
        alt="GLUTN - Especialista en Pastas"
        class="logo"
      />
    </div>

    <span class="quick-eyebrow">
      INGRESO RÁPIDO
    </span>

    <h1 class="quick-titulo">
      Elegí un usuario
    </h1>

    <p class="instruction">
      Seleccioná el perfil con el que querés
      ingresar a la aplicación.
    </p>

    <section
      class="users-grid"
      aria-label="Usuarios de acceso rápido"
    >
      @for (
        usuario of usuarios;
        track usuario.email;
        let i = $index
      ) {
        <button
          class="user-card"
          [class.loading]="usuarioIngresando === usuario.email"
          [style.animation-delay.ms]="i * 70"
          type="button"
          (click)="ingresar(usuario)"
          [attr.aria-label]="'Ingresar como ' + usuario.rol"
        >
          <div class="photo-wrapper">
            <img
              [src]="usuario.foto"
              [alt]="'Foto de ' + usuario.nombre"
            />
          </div>

          <div class="user-info">
            <strong>
              {{ usuario.nombre }}
            </strong>

            <span>
              {{ usuario.rol }}
            </span>
          </div>
        </button>
      }
    </section>

    <footer class="quick-footer">
      <ion-icon
        name="person-circle-outline"
      ></ion-icon>

      <span>
        Usuarios disponibles para demostración
      </span>
    </footer>
  </main>
</ion-content>

@if (usuarioIngresando !== null) {
  <div class="quick-loading">
    <app-spinner-logo />
    <span>Ingresando...</span>
  </div>
}
