<ion-content
  [fullscreen]="true"
  class="quick-content"
>

  <main class="quick-page">

    <header class="quick-header">

      <button
        class="back-button"
        type="button"
        (click)="volver()"
        aria-label="Volver al inicio de sesión"
      >

        <ion-icon
          name="arrow-back-outline"
        ></ion-icon>

      </button>


      <div class="brand">

        <img
          src="assets/images/LOGO-GLUTN.png"
          alt="GLUTN"
        />

        <div>

          <span>
            INGRESO RÁPIDO
          </span>

          <h1>
            Elegí un usuario
          </h1>

        </div>

      </div>

    </header>


    <p class="instruction">

      Seleccioná el perfil con el que querés
      ingresar a la aplicación.

    </p>


    <section
      class="users-grid"
      aria-label="Usuarios de acceso rápido"
    >

      @for (
        usuario of usuarios;
        track usuario.email;
        let i = $index
      ) {

        <button
          class="user-card"
          [class.loading]="
            usuarioIngresando === usuario.email
          "
          [style.animation-delay.ms]="i * 70"
          type="button"
          (click)="ingresar(usuario)"
          [attr.aria-label]="
            'Ingresar como ' + usuario.rol
          "
        >

          <div class="photo-wrapper">

            <img
              [src]="usuario.foto"
              [alt]="'Foto de ' + usuario.nombre"
            />

            @if (
              usuarioIngresando === usuario.email
            ) {

              <span
                class="card-spinner"
              ></span>

            }

          </div>


          <div class="user-info">

            <strong>
              {{ usuario.nombre }}
            </strong>

            <span>
              {{ usuario.rol }}
            </span>

          </div>

        </button>

      }

    </section>


    <footer class="quick-footer">

      <ion-icon
        name="person-circle-outline"
      ></ion-icon>

      <span>
        Usuarios disponibles para demostración
      </span>

    </footer>

  </main>

</ion-content>
