<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <app-confirm-volver (confirmadoVolver)="volver()"></app-confirm-volver>
    </ion-buttons>

    <ion-title>Pedidos</ion-title>

    <ion-buttons slot="end">
      <app-confirm-dialog
        titulo="¿Cerrar sesión?"
        mensaje="Vas a tener que volver a ingresar tus credenciales para acceder de nuevo."
        textoConfirmar="Cerrar sesión"
        (confirmado)="cerrarSesion()"
      ></app-confirm-dialog>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (cargando()) {
    <p>Cargando...</p>
  } @else if (pedidos().length === 0) {
    <p class="sin-pedidos">No hay pedidos pendientes.</p>
  } @else {
    <div class="lista-pedidos">
      @for (pedido of pedidos(); track pedido.id_pedido) {
        <div class="pedido-card">
          <div class="pedido-card__info">
            <span class="body-medium weight-bold">Mesa {{ pedido.id_mesa.slice(0, 8) }}</span>
            <span class="body-small">Subtotal: {{ pedido.subtotal | currency:'ARS':'symbol':'1.0-0' }}</span>
          </div>

          <div class="pedido-card__acciones">
            <ion-button shape="round" fill="outline" color="danger" size="small" [disabled]="estado() === pedido.id_pedido" (click)="rechazar(pedido.id_pedido)">
              Rechazar
            </ion-button>
            <ion-button shape="round" size="small" [disabled]="estado() === pedido.id_pedido" (click)="confirmar(pedido.id_pedido)">
              Aceptar
            </ion-button>
          </div>
        </div>
      }
    </div>
  }
</ion-content>
