<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <img
        src="assets/images/LOGO-GLUTN.png"
        alt="GLUTN - Especialista en Pastas"
        class="logo"
      />
      <!-- <app-confirm-volver (confirmadoVolver)="volver()"></app-confirm-volver> -->
    </ion-buttons>

    <ion-title>Administración</ion-title>

    <ion-buttons slot="end">
      <app-confirm-dialog
        titulo="¿Cerrar sesión?"
        mensaje="Vas a tener que volver a ingresar tus credenciales para acceder de nuevo."
        textoConfirmar="Cerrar sesión"
        (confirmado)="cerrarSesion()"
      ></app-confirm-dialog>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<!-- <app-header
  title="Administración"
  action="logout"
  backHref="/seleccion-acceso"
/> -->

<ion-content class="admin-content">
  <div class="admin-container">
    <div class="header-section">
      <!-- <app-confirm-volver (confirmadoVolver)="volver()"></app-confirm-volver> -->

      <h1>Panel de administración</h1>

      <p>Seleccioná una sección para continuar.</p>
    </div>

    <div class="modules-container">
      @for (modulo of modulosVisibles; track modulo.id) {
      <app-admin-module-card
        [module]="modulo"
        (selected)="seleccionarModulo($event)"
        [routerLink]="modulo.path"
        [icon]="modulo.icon"
      >
      </app-admin-module-card>
      }
    </div>
  </div>
</ion-content>
