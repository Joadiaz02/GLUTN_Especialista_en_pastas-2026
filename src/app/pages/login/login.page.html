<link rel="stylesheet" href="./login.page.scss">

<div class="login">
  <div class="logo_container">
    <img [src]="logo" class="logo">
  </div>

  <div>
    <h1 class="textos">iniciar sesión</h1>
    <p class="textos">Por favor iniciar sesión primero para disfrutar del servicio</p>
  </div>

  <div>
    <label class="textos" for="email" [style.color]="emailInput.touched && !email ? '#E76F45 ' : '#D9A441 '">
      {{ emailInput.touched && !email ? 'correo electrónico requerido' : 'correo electrónico' }}
    </label>
    <input [(ngModel)]="email" class="input" placeholder="jperez@ejemplo.com" id="email" #emailInput="ngModel">
    <label class="textos" for="contrasena" [style.color]="contraInput.touched && !contrasena ? '#E76F45 ' : '#D9A441 '">
      {{ contraInput.touched && !contrasena ? 'contraseña requerida' : 'contraseña' }}
    </label>
    <input [(ngModel)]="contrasena" class="input" placeholder="Contraseña" type="password" #contraInput="ngModel">

  </div>

  <button (click)="iniciarSesion()" [disabled]="cargando()" class="boton_i">
      @if (cargando()) {
        <div class="spinner"></div>
      }@else{
        iniciar sesión
      }
      
  </button>

  <div class="separador">
    <span class="linea_isq"></span>
    <span class="punto"></span>
    <span class="linea_isq"></span>
  </div>

  <div>
    <button routerLink="/invitado"  class="boton_c">
        Continuar como invitado
    </button>
  </div>

  <div class="boton_container">
    <button routerLink="/acceso_rapido" class="boton_a">
        Acceso rápido
    </button>
  </div>

  <div class="registrate">
    <p class="textos">¿no tienes cuenta?<a routerLink="/register" class="registrate_spam">Registrarse</a></p>
  </div>
</div>
