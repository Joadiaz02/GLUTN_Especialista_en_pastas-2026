<link rel="stylesheet" href="./login.page.scss" />

<ion-content class="ion-padding">
  <div class="login">

    <div class="logo_container">
      <img [src]="logo" alt="Logo GLUTN" class="logo">
    </div>

    <ion-text>
      <h2 class="textos">Iniciar sesión</h2>
    </ion-text>

    <ion-text>
      <p class="textos">Por favor inicie sesión primero para disfrutar del servicio</p>
    </ion-text>

    <ion-item class="input">
      <ion-label class="textos" position="stacked" [style.color]="credencialesinvalidas() ? 'var(--ion-color-danger)' : 'var(--text-primary)'">
        Correo electrónico
      </ion-label>
      <ion-input [(ngModel)]="email" type="email" placeholder="jperez@ejemplo.com"></ion-input>
    </ion-item>

    <ion-item class="input">
      <ion-label class="textos" position="stacked" [style.color]="credencialesinvalidas() ? 'var(--ion-color-danger)' : 'var(--text-primary)'">
        Contraseña
      </ion-label>
      <ion-input [(ngModel)]="contrasena" type="password" placeholder="Contraseña"></ion-input>
    </ion-item>

    <ion-button expand="block" class="boton_i" (click)="iniciarSesion()" [disabled]="cargando()">
      @if (cargando()) {
        <ion-spinner name="dots"></ion-spinner>
      } @else {
        Iniciar sesión
      }
    </ion-button>

    <div class="separador">
      <span class="linea_isq"></span>
      <span class="punto"></span>
      <span class="linea_isq"></span>
    </div>

    <ion-button expand="block" fill="outline" class="boton_c">
      Continuar como invitado
    </ion-button>

    <ion-button expand="block" fill="outline" class="boton_a">
      Acceso rápido
    </ion-button>

    <p class="registrate">
      ¿No tenés cuenta? <a routerLink="/registro" class="registrate_spam">Registrate</a>
    </p>

  </div>
</ion-content>
