<link rel="stylesheet" href="./login.page.scss" />

<div class="login">
  <div class="logo_container">
    <img [src]="logo" class="logo" />
  </div>

  <div>
    <h1 class="textos">iniciar sesion</h1>
    <p class="textos">
      por favor inicie secion primero para drisfutar del servicio
    </p>
  </div>

  <div>
    <label
      class="textos"
      for="email"
      [style.color]="emailInput.touched && !email ? 'red' : 'white'"
    >
      {{ emailInput.touched && !email ? 'correo electrónico requerido' : 'correo
      electrónico' }}
    </label>
    <input
      [(ngModel)]="email"
      class="input"
      placeholder="jperez@ejemplo.com"
      id="email"
      #emailInput="ngModel"
    />
    <label
      class="textos"
      for="contrasena"
      [style.color]="contraInput.touched && !contrasena ? 'red' : 'white'"
    >
      {{ contraInput.touched && !contrasena ? 'contraseña requerida' :
      'contraseña' }}
    </label>
    <input
      [(ngModel)]="contrasena"
      class="input"
      placeholder="Contraseña"
      type="password"
      #contraInput="ngModel"
    />
  </div>

  <button (click)="iniciarSesion()" class="boton_i">Iniciar sesión</button>

  <div class="separador">
    <span class="linea_isq"></span>
    <span class="punto"></span>
    <span class="linea_isq"></span>
  </div>

  <div>
    <button routerLink="/guest" class="boton_c">Continuar como invitado</button>
  </div>

  <div class="boton_container">
    <button routerLink="/acceso_rapido" class="boton_a">Acceso rapido</button>
  </div>

  <div class="registrate">
    <p class="textos">
      ¿no tenes cuenta?<a routerLink="/register" class="registrate_spam"
        >Registrate</a
      >
    </p>
  </div>
</div>
