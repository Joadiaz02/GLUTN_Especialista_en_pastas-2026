<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Reservas</ion-title>
    <ion-buttons slot="end">
      <app-confirm-dialog
        titulo="¿Cerrar sesión?"
        mensaje="Vas a tener que volver a ingresar tus credenciales para acceder de nuevo."
        textoConfirmar="Cerrar sesión"
        icono="log-out-outline"
        (confirmado)="cerrarSesion()"
      ></app-confirm-dialog>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="reservas-content">
  <div class="logo-container">
    <img
      src="assets/images/LOGO-GLUTN.png"
      alt="GLUTN - Especialista en Pastas"
      class="logo"
    />
  </div>

  <p class="reservas-subtitulo">Gestioná la reserva de tu mesa</p>

  <div class="reservas-lista">
    <ion-button
      class="reserva-boton"
      expand="block"
      shape="round"
      (click)="goToNuevaReserva()"
    >
      Nueva reserva
    </ion-button>

    <ion-button
      class="reserva-boton"
      expand="block"
      shape="round"
      (click)="goToMisReservas()"
    >
      Mis reservas
    </ion-button>
  </div>
</ion-content>
