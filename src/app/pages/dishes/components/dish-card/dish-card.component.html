<div class="dish-card">
  <img class="dish-card__image" [src]="image()" />

  <div class="dish-card__info">
    <div class="dish-card__details">
      <h3 class="dish-card__name">{{ name() }}</h3>
      <p class="dish-card__description">{{ description() }}</p>
    </div>

    <span class="dish-card__price">{{ price() | currency }}</span>
  </div>

  <div class="dish-card__actions">
    <button
      type="button"
      class="dish-card__action"
      [class.dish-card__action--active]="sugerencia()"
      (click)="destacar.emit()"
    >
      <ion-icon [name]="sugerencia() ? 'star' : 'star-outline'"></ion-icon>
    </button>

    <button type="button" class="dish-card__action" (click)="editar.emit()">
      <ion-icon name="create-outline"></ion-icon>
    </button>

    <button type="button" class="dish-card__action dish-card__action--danger" (click)="baja.emit()">
      <ion-icon name="trash-outline"></ion-icon>
    </button>
  </div>
</div>
