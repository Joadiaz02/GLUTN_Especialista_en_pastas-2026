<button
  (click)="open()"
  class="upload-placeholder"
  [disabled]="uploading()"
>

  @if (uploading()) {

    <app-spinner-logo size="sm" />

  } @else if (
    photoPreview() ||
    initialPreview()
  ) {

    <img
      [src]="
        photoPreview() ??
        initialPreview()
      "
      alt="Preview"
      class="upload-preview"
    />

  } @else {

    <ion-icon
      src="assets/icons/plus.svg"
    ></ion-icon>

  }

</button>
