<div class="dish-card">
  <ion-skeleton-text
    [animated]="true"
    style="
      width: 75px;
      height: 75px;
      background-color: #86926e;
      border-radius: 12px;
    "
  ></ion-skeleton-text>

  <div class="dish-card__info">
    <div class="dish-card__details">
      <ion-skeleton-text
        [animated]="true"
        style="
          width: 112px;
          height: 16px;
          background-color: #86926e;
          border-radius: 50px;
        "
      ></ion-skeleton-text>
      <ion-skeleton-text
        [animated]="true"
        style="
          width: 40px;
          height: 16px;
          background-color: #86926e;
          border-radius: 50px;
        "
      ></ion-skeleton-text>
    </div>

    <ion-skeleton-text
      [animated]="true"
      style="
        width: 64px;
        height: 16px;
        background-color: #86926e;
        border-radius: 50px;
      "
    ></ion-skeleton-text>
  </div>
</div>
