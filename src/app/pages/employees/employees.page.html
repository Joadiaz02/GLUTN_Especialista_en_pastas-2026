<app-header
  title="Empleados"
  action="add"
  routeName="create"
  backHref="/admin"
/>

<ion-content [fullscreen]="true">
  <section class="users-grid" aria-label="Usuarios de acceso rápido">
    @for ( usuario of users(); track usuario.email; let i = $index ) {

    <button
      class="user-card"
      [style.animation-delay.ms]="i * 70"
      type="button"
      [attr.aria-label]="
            'Ingresar como ' + usuario.rol
          "
    >
      <div class="photo-wrapper">
        <img [src]="usuario.avatar" [alt]="'Foto de ' + usuario.nombre" />
      </div>

      <div class="user-info">
        <strong> {{ usuario.nombre }} {{ usuario.apellido }} </strong>

        <span> {{ usuario.perfil }} </span>
      </div>
