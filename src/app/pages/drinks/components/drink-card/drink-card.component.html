<div class="drink-card" [class.drink-card--not-available]="available()">
  <div class="drink-card__content">
    <img
      class="drink-card__image"
      [src]="image()"
      [alt]="name()"
      [class.drink-card__image--not-available]="available()"
    />

    <div class="drink-card__info">
      <div class="drink-card__details">
        <h3 class="drink-card__name">{{ name() }}</h3>
        @if (available()) {
        <span class="drink-card__badge">Baja</span>
        }
        <p class="drink-card__description">{{ description() }}</p>
      </div>

      <span class="drink-card__price">{{ price() | currency }}</span>
    </div>
  </div>
