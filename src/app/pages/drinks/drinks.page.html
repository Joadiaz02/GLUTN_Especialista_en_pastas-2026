<ion-header class="ion-no-border">
  <ion-toolbar>
  <ion-buttons slot="start">
    <app-confirm-volver (confirmadoVolver)="volver()"></app-confirm-volver>
  </ion-buttons>

    <ion-title>Bebidas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="drinks">
    <button routerLink="create" class="drink-placeholder">
      <ion-icon src="assets/icons/plus.svg"></ion-icon>
    </button>

    @if (!isLoading()) { @for (drink of drinks(); track $index) {
    <app-drink-card
      [name]="drink.titulo"
      [description]="drink.descripcion"
      [price]="drink.precio"
      [image]="drink.imagen_1"
    ></app-drink-card>
    } } @else { @for (i of [1, 2, 3, 4, 5]; track $index) {
    <app-skeleton-card />
    } }
  </div>
</ion-content>
