<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text=""></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="carta-content">
  <h1 class="carta-titulo">Nuestra Carta</h1>

  <div class="carta-botones">
    <ion-button expand="block" shape="round" (click)="irA('plato')">
      Platos
    </ion-button>

    <ion-button expand="block" shape="round" (click)="irA('bebida')">
      Bebidas
    </ion-button>

    <ion-button expand="block" shape="round" (click)="irA('postre')">
      Postres
    </ion-button>
  </div>
</ion-content>
