<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <app-confirm-volver (confirmadoVolver)="volver()"></app-confirm-volver>
    </ion-buttons>

    <ion-title>Mesas</ion-title>

    <ion-buttons slot="end">
      <ion-button fill="outline" shape="round" size="small" routerLink="create">
        <ion-icon slot="icon-only" src="assets/icons/add.svg"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="mesas-list" [fullscreen]="true">
  @if (!hayMesas() && !cargando()) {
  <button class="agregar-vacio" type="button" (click)="crearMesa()">
    <ion-icon name="add-outline"></ion-icon>
  </button>
  } @if (hayMesas()) {
  <div class="grid-mesas">
    @for (mesa of mesas(); track mesa.id) {
    <div class="mesa-card">
      <div class="mesa-foto">
        @if (mesa.foto) {
        <img [src]="mesa.foto" alt="Foto de la mesa {{ mesa.numero }}" />
        } @else {
        <ion-icon name="image-outline"></ion-icon>
        }
      </div>

      <div class="mesa-info">
        <div class="mesa-card-header">
          <span class="mesa-numero">Mesa {{ mesa.numero }}</span>
          <span
            class="badge-disponibilidad"
            [class]="'badge-' + mesa.disponibilidad"
            >{{ disponibilidadLabel[mesa.disponibilidad] }}</span
          >
        </div>

        <p class="mesa-detalle">
          {{ tipoLabel[mesa.tipo] }} · {{ mesa.comensales }} personas
        </p>

        <div class="mesa-card-acciones">
          <button type="button" (click)="verQr(mesa)">
            <ion-icon name="qr-code-outline"></ion-icon>
            QR
          </button>
          <button type="button" (click)="cambiarDisponibilidad(mesa, $event)">
            <ion-icon name="sync-outline"></ion-icon>
            Estado
          </button>
        </div>
      </div>
    </div>
    }
  </div>
  }
</ion-content>
