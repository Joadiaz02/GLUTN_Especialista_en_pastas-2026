<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <app-confirm-volver (confirmadoVolver)="volver()"></app-confirm-volver>
    </ion-buttons>
    <ion-title>Crear Mesa</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- <div class="foto-wrapper">
    <button class="foto-thumb" type="button" (click)="tomarFoto()">
      @if (fotoPreview()) {
      <img [src]="fotoPreview()" alt="Foto de la mesa" />
      } @else {
      <ion-icon name="camera-outline"></ion-icon>
      }
      <span class="foto-badge">+</span>
    </button>
    @if (errores()['foto']) {
    <p class="error">{{ errores()['foto'] }}</p>
    }
  </div> -->

  <gtn-uploader [onlyTake]="true" (fileSelected)="onPhotoSelected(0, $event)" />

  <form class="fields">
    <div class="field">
      <label class="field__label">Número</label>

      <ion-input
        fill="outline"
        class="field__input"
        placeholder="Número"
      />
    </div>

    <div class="field">
      <label class="field__label">Comensales</label>

      <div class="stepper">
        <button type="button" class="stepper__button" (click)="decrementarComensales()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g clip-path="url(#clip0_3082_1945)">
              <mask id="mask0_3082_1945" style="mask-type:luminance" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
                <path d="M24 0H0V24H24V0Z" fill="white"/>
              </mask>
              <g mask="url(#mask0_3082_1945)">
                <path d="M18 12.75H6C5.59 12.75 5.25 12.41 5.25 12C5.25 11.59 5.59 11.25 6 11.25H18C18.41 11.25 18.75 11.59 18.75 12C18.75 12.41 18.41 12.75 18 12.75Z" fill="white"/>
              </g>
            </g>
          </svg>
        </button>
        <span class="stepper__value">{{ comensales() }}</span>
        <button type="button" class="stepper__button" (click)="incrementarComensales()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g clip-path="url(#clip0_3390_1703)">
              <mask id="mask0_3390_1703" style="mask-type:luminance" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
                <path d="M24 0H0V24H24V0Z" fill="white"/>
              </mask>
              <g mask="url(#mask0_3390_1703)">
                <path d="M6 12H18" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 18V6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </g>
            </g>
          </svg>
        </button>
      </div>
    </div>

    <div class="field">
      <label class="field__label">Tipo</label>

      <div class="chips">
        @for (t of types; track t.type) {
          <button
            type="button"
            class="chip"
            [class.chip-activo]="tipo() === t.type"
            (click)="seleccionarTipo(t.type)"
          >
            {{ t.value }}
          </button>
        }
      </div>
    </div>
  </form>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-actions">
    <ion-button
      expand="block"
      shape="round"
      /* [disabled]="(form.statusChanges | async) !== 'VALID'"
      (click)="create()" */
    >
      <!-- @if (isLoading()) { <ion-spinner name="crescent"></ion-spinner> } -->
      Crear</ion-button
    >
  </div>
</ion-footer>
