<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button
        text=""
        icon="assets/icons/arrow-left.svg"
      ></ion-back-button>
    </ion-buttons>

    <ion-title> {{ getStepTitle() }} </ion-title>
  </ion-toolbar>

  <app-progress-bar
    [totalSteps]="2"
    [currentStep]="currentStep()"
  ></app-progress-bar>
</ion-header>

<ion-content>
  @switch (currentStep()) { @case (1) {

  <app-identity-step [control]="form" />

  <div class="guest-extra" [formGroup]="form">
    <div class="guest-extra__section">
      <h2>¿Cuántos son?</h2>

      <!-- <p>Indicá la cantidad de personas que van a ocupar la mesa.</p> -->

      <div class="guest-stepper">
        <button
          type="button"
          aria-label="Disminuir cantidad"
          [disabled]="form.controls.comensales.value === 1"
          (click)="ajustarComensales(-1)"
        >
          −
        </button>

        <strong> {{ form.controls.comensales.value }} </strong>

        <button
          type="button"
          aria-label="Aumentar cantidad"
          [disabled]="form.controls.comensales.value === 20"
          (click)="ajustarComensales(1)"
        >
          +
        </button>
      </div>
    </div>

    <div class="guest-extra__section">
      <h2>Eliga el tipo de mesa</h2>

      <!-- <p>Podés seleccionar más de una.</p> -->

      <div class="guest-options">
        <button
          type="button"
          class="guest-option"
          [class.guest-option--active]="
                tieneConsideracion('estandar')
              "
          (click)="
                toggleConsideracion('estandar')
              "
        >
          Estandar
        </button>

        <button
          type="button"
          class="guest-option"
          [class.guest-option--active]="
                tieneConsideracion('vip')
              "
          (click)="
                toggleConsideracion('vip')
              "
        >
          VIP
        </button>

        <button
          type="button"
          class="guest-option"
          [class.guest-option--active]="
                tieneConsideracion('vip_movilidad_reducida')
              "
          (click)="
                toggleConsideracion('vip_movilidad_reducida')
              "
        >
          VIP con Movilidad Reducida
        </button>

        <button
          type="button"
          class="guest-option"
          [class.guest-option--active]="
                tieneConsideracion('movilidad_reducida')
              "
          (click)="
                toggleConsideracion('movilidad_reducida')
              "
        >
          Movilidad Reducida
        </button>
      </div>
    </div>
  </div>

  } @case (2) {

  <app-location-step />

  } }
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-actions">
    @if (currentStep() === 1) {

    <ion-button
      expand="block"
      shape="round"
      (click)="nextStep()"
      [disabled]="form.invalid"
    >
      Continuar
    </ion-button>

    } @else if (currentStep() === 2) {

    <ion-button
      expand="block"
      shape="round"
      (click)="scanQR()"
      [disabled]="scanning()"
    >
      Escanear QR
    </ion-button>

    <ion-button
      expand="block"
      shape="round"
      fill="outline"
      (click)="previousStep()"
      [disabled]="scanning()"
    >
      Volver
    </ion-button>

    }
  </div>
</ion-footer>

@if (scanning()) {
<div class="quick-loading">
  <app-spinner-logo />
  <span>Cargando...</span>
</div>
}
