<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button
        text=""
        icon="assets/icons/arrow-left.svg"
      ></ion-back-button>
    </ion-buttons>

    <ion-title>{{ getStepTitle() }}</ion-title>
  </ion-toolbar>

  <app-progress-bar
    [totalSteps]="2"
    [currentStep]="currentStep()"
  ></app-progress-bar>
</ion-header>

<ion-content [fullscreen]="true">
  @switch (currentStep()) { @case (1) {
  <app-identity-step [control]="form" />
  } @case (2) {
  <app-location-step />
  } }
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-actions">
    @if (currentStep() === 1) {
    <ion-button
      expand="block"
      shape="round"
      (click)="nextStep()"
      [disabled]="(form.statusChanges | async) !== 'VALID'"
      >Continuar</ion-button
    >
    } @else if (currentStep() === 2) {
    <ion-button expand="block" shape="round" (click)="scanQR()"
      >Escanear QR</ion-button
    >
    <ion-button
      expand="block"
      shape="round"
      fill="outline"
      (click)="previousStep()"
      >Volver</ion-button
    >
    }
  </div>
</ion-footer>
