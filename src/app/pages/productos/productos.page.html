<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <app-confirm-volver (confirmadoVolver)="volver()"></app-confirm-volver>
    </ion-buttons>

    <h1 class="titulo-toolbar">{{ titulo() }}</h1>

    <app-confirm-dialog
      slot="end"
      (confirmado)="cerrarSesion()"
    ></app-confirm-dialog>
  </ion-toolbar>
</ion-header>

<ion-content class="products-content">
  <div
    class="products-wrapper"
    [class.con-barra-pedido]="
      puedePedir() && carrito.totalItems() > 0
    "
  >
    <!-- BUSCADOR -->

    <!-- <ion-searchbar
      [placeholder]="
        'Buscar en ' + (titulo() | lowercase)
      "
      [debounce]="200"
      [value]="textoBusqueda()"
      (ionInput)="
        onBuscar($event.detail.value ?? '')
      "
    ></ion-searchbar> -->

    <!-- LOADING -->

    @if (isLoading()) {

    <div class="sin-resultados">
      <app-spinner-logo />
    </div>

    }

    <!-- SIN PRODUCTOS -->

    @else if (productos().length === 0) {

    <div class="sin-resultados">
      <p>Todavía no hay productos cargados en esta sección.</p>
    </div>

    }

    <!-- SIN RESULTADOS -->

    @else if (productosFiltrados().length === 0) {

    <div class="sin-resultados">
      <p>No encontramos nada que coincida con tu búsqueda.</p>
    </div>

    }

    <!-- CARRUSEL -->

    @else {

    <app-producto-carrusel
      [productos]="productosFiltrados()"
      [puedePedir]="puedePedir()"
      [etiqueta]="
          tipo() === 'plato'
            ? 'platos'
            : tipo() === 'bebida'
              ? 'bebidas'
              : 'postres'
        "
    ></app-producto-carrusel>

    <!-- <app-clients-navigation
      [posicionActual]="posicionVisible"
      [totalClientes]="totalClientes"
      [showButtons]="false"
      message="Deslizá para cambiar de producto"
    /> -->
    }
  </div>

  <!-- BARRA DEL PEDIDO -->

  @if (puedePedir()) {
  <app-barra-pedido></app-barra-pedido>
  }
</ion-content>
