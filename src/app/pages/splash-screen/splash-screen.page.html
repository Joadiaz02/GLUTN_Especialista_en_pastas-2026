<div
  class="splash-container"
  [class.fade-out]="isFadingOut"
>
  <!-- Encabezado -->
  <header class="splash-header">
    <p class="universidad">
      UNIVERSIDAD TECNOLÓGICA NACIONAL
    </p>

    <h1>TRABAJO FINAL INTEGRADOR</h1>

    <div class="titulo-decoracion">
      <span></span>
      <span class="decoracion-centro"></span>
      <span></span>
    </div>
  </header>

  <!-- Logo -->
  <div class="logo-container">
    <img
      src="assets/images/LOGO-GLUTN.png"
      alt="GLUTN - Especialista en Pastas"
      class="logo"
    />
  </div>

  <!-- Integrantes -->
  <section class="integrantes-container">
    <h2>Integrantes</h2>

    <p class="integrante integrante-1">
      Joaquín Felipe Díaz
    </p>

    <p class="integrante integrante-2">
      Javier Francisco Vilchez
    </p>

    <p class="integrante integrante-3">
      Mariano Pastor
    </p>

    <p class="integrante integrante-4">
      Lucas Nicolás Ponte
    </p>
  </section>

  <!-- Pie de pantalla -->
  <footer class="splash-footer">
    <div class="footer-icon" aria-hidden="true">
      <svg
        viewBox="0 0 64 64"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M32 53V24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />

        <path
          d="M32 43C18 43 12 35 12 27C25 27 32 34 32 43Z"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linejoin="round"
        />

        <path
          d="M32 34C32 21 40 14 51 14C51 26 44 34 32 34Z"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linejoin="round"
        />

        <path
          d="M32 51C42 51 48 46 52 40"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </div>

    <p class="footer-frase">
      Una experiencia de sabor, tecnología y trabajo en equipo
    </p>

    <p class="footer-anio">2026</p>
  </footer>
</div>
